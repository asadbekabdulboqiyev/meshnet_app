Description: |
  MeshNet is an offline-first, peer-to-peer mesh networking app for Android.
  It creates a decentralized communication layer where devices connect directly
  via Bluetooth Low Energy (BLE) and Wi-Fi Direct — no internet, no SIM card,
  no central server required.

  ## Core Features

  **Messaging & Chat**
  - End-to-end encrypted 1:1 and group chats
  - Double Ratchet (X25519 + ChaCha20-Poly1305) with forward secrecy
  - QR code pairing for out-of-band trust establishment
  - Read receipts, delivery reports, typing indicators
  - Voice messages (Opus codec)
  - File sharing (images, documents, any file type)

  **LocalNet Platform (Offline LAN)**
  - Decentralized DNS (.mesh hostnames) — no central server
  - Built-in HTTP server (port 8080) — serves over Wi-Fi Direct
  - Distributed file system — chunked, deduplicated, resumable sync
  - Real-time collaboration: whiteboard, collaborative notes, polls
  - Offline App Store — share and install APKs over the mesh
  - Internet Gateway — HTTP/CONNECT proxy via mesh peers

  **Networking**
  - Dual transport: BLE (long-range, low power) + Wi-Fi Direct (high throughput)
  - Multi-hop relay (up to 4 hops)
  - Store-and-forward for offline peers
  - Network topology visualization

  **Security & Privacy**
  - E2E encryption by default (X25519 + ChaCha20-Poly1305)
  - Double Ratchet forward secrecy
  - QR code pairing for trust-on-first-use
  - No central servers, no metadata collection
  - RBAC access control for mesh resources

RepoType: git
