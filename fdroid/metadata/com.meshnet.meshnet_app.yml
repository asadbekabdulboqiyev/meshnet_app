Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release.apk
    target: android-34
    ndkVersion: 26.1.10909125
    ndkPath: $ANDROID_NDK_HOME
    sdk: android-34
    flavorDimensions: flutter
    flavors:
      - release
    prebuild:
      - flutter pub get
      - flutter build apk --release --no-tree-shake-icons
    outputPaths:
      - app/build/outputs/apk/release/app-release.apk
    files:
      - app/build/outputs/apk/release/app-release.apk
    verify:
      - sha256

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1

MaintainerNotes: |
  MeshNet is a complete offline P2P mesh networking platform.
  Built with Flutter (Dart) for UI and Kotlin for native mesh engine.
  All networking, crypto, and routing implemented in Kotlin native.
